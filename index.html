<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B1E1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuaderno">
<title>Cuaderno</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#ECE5D8; --bg-dot:#DCD3C3; --brown:#2B1E1A; --brown-2:#4A3A33; --teal:#0E6E64; --teal-2:#0B5A52;
  --card:#F7E6E3; --card-iris:#E3ECEF; --card-part:#EFEBDD; --line:#9E2238; --chip:#EADBD7; --muted:#7A6B63;
  --white:#FFFDF9; --ok:#2E7D4F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);
  background-image:radial-gradient(var(--bg-dot) 1px,transparent 1px);background-size:18px 18px;color:var(--brown);
  padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
header{position:sticky;top:0;z-index:20;background:var(--brown);color:#F4ECE0;padding:calc(12px + env(safe-area-inset-top)) 18px 12px}
.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.sub{font-size:13px;opacity:.75;margin-bottom:2px}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:26px;margin:0;letter-spacing:.2px}
.hicons{display:flex;gap:6px}
.hicons button{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;color:#F4ECE0}
.hicons button:active{background:rgba(255,255,255,.12)}
#searchBar{display:none;margin-top:10px}
#searchBar.on{display:flex;gap:8px}
#q{flex:1;border:0;border-radius:12px;padding:11px 14px;font-size:16px;background:#F4ECE0;color:var(--brown)}
main{padding:12px 10px 170px}
.install{width:100%;display:flex;align-items:center;gap:12px;background:var(--teal);color:#fff;border-radius:16px;padding:15px 18px;font-size:17px;margin-bottom:14px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.install[hidden]{display:none}
.card{position:relative;background:var(--card);border-radius:14px;border-left:5px solid var(--line);padding:12px 12px 10px 10px;margin-bottom:12px;box-shadow:0 1px 4px rgba(60,30,20,.12)}
.card.iris{background:var(--card-iris);border-left-color:#1E5A78}
.card.particular{background:var(--card-part);border-left-color:#8A6A2E}
.card.done{opacity:.8}
.card{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.card.lift{position:fixed;z-index:30;margin:0;pointer-events:none;transform:scale(1.03);box-shadow:0 14px 30px rgba(40,25,15,.32);transition:transform .12s,box-shadow .12s}
.card.pressing{transform:scale(.985);transition:transform .35s}
.ph-drag{border:2px dashed #BFB2A4;border-radius:14px;margin-bottom:12px;background:rgba(255,253,249,.45)}
body.dragging{touch-action:none}
.top{display:flex;gap:6px}
.arrows{display:flex;flex-direction:column;align-items:center;gap:4px;color:#8F7F78;margin:-4px 0 0 -4px}
.arrows button{width:46px;height:46px;display:grid;place-items:center;border-radius:12px;background:rgba(43,30,26,.05)}
.arrows button:active{background:rgba(43,30,26,.16)}
.arrows svg{width:28px;height:28px;stroke-width:2.4}
.ttl{flex:1;min-width:0}
.addr{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:18px;line-height:1.25;margin:2px 0 4px;cursor:pointer}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.num{font-weight:800;font-size:17px;letter-spacing:.3px}
.ago{color:var(--muted);font-size:14px;white-space:nowrap}
.who{font-size:13px;color:var(--brown-2);margin-top:2px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;background:rgba(43,30,26,.08);margin-right:6px;text-transform:uppercase;letter-spacing:.4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:11px 8px;font-size:15px;font-weight:600;text-decoration:none;color:inherit;min-height:44px}
.btn svg{width:18px;height:18px}
.call{background:var(--brown);color:#fff}
.wa{background:var(--teal);color:#fff}
.soft{background:var(--chip);color:var(--brown)}
.iris .soft{background:#D3DFE4}.particular .soft{background:#E2DCC8}
.checks{display:grid;grid-template-columns:repeat(5,1fr);margin-top:10px}
.checks label{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:13px;color:var(--brown-2);cursor:pointer}
.checks input{appearance:none;-webkit-appearance:none;width:26px;height:26px;border:1.5px solid #B9A9A3;border-radius:7px;background:#F6EEEC;display:grid;place-items:center;margin:0}
.checks input:checked{background:var(--teal);border-color:var(--teal)}
.checks input:checked::after{content:"";width:7px;height:13px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.visita{display:flex;align-items:center;gap:10px;width:100%;margin-top:8px;border-radius:10px;padding:9px 12px;min-height:44px;background:rgba(255,253,249,.65);border:1.5px dashed #C9B9B2;text-align:left}
.visita svg{width:20px;height:20px;flex:none;color:var(--muted)}
.visita .vl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);display:block}
.visita .vv{font-size:15.5px;font-weight:700;color:var(--brown)}
.visita.set{border:1.5px solid var(--teal);background:#E2F0EC}
.visita.set svg{color:var(--teal)}
.visita.hoy{background:var(--teal);border-color:var(--teal)}
.visita.hoy .vl,.visita.hoy .vv,.visita.hoy svg{color:#fff}
.visita.pasada.set{border-color:#B9A9A3;background:rgba(255,253,249,.5)}
.visita.pasada svg{color:var(--muted)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick button{border:1.5px solid #E0D6CA;border-radius:20px;padding:7px 12px;font-size:14px;font-weight:600;background:#FBF7F1}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;line-height:1.3;background:#E6E0D8;color:#4A3A33}
.chip.m-asistencia{background:#D7EDDC;color:#1F5E33}.m-brico{background:#e0f2f1;color:#00695c}.chip.m-agua{background:#D6E6F5;color:#1B4F7E}.chip.m-dae{background:#F6D9D9;color:#8E1B1B}.chip.m-conexion{background:#F5E6C8;color:#7A5410}
.chip.p-lucia{background:#1F4E9C;color:#fff}.chip.p-caixa{background:#0A7FB0;color:#fff}.chip.p-naturgy{background:#E5781E;color:#fff}.chip.p-anovo{background:#6B3FA0;color:#fff}.chip.p-otro{background:#5E4F48;color:#fff}
.sheet .chips{margin:-6px 0 12px}
.imp-card{font-size:13.5px;font-weight:700;color:var(--teal-2);margin-top:3px}
.imps{display:flex;flex-direction:column;gap:8px}
.imp{border:1.5px solid #E0D6CA;border-radius:12px;background:#FBF7F1;padding:8px}
.imp input{width:100%;border:1.5px solid #E0D6CA;border-radius:9px;padding:10px;font-size:16px;background:var(--white);color:var(--brown);font-family:inherit;min-height:44px}
.imp input:focus{outline:none;border-color:var(--teal)}
.imp .r1{display:grid;grid-template-columns:38% 1fr;gap:6px}
.imp .r2{display:grid;grid-template-columns:64px 1fr auto 44px;gap:6px;align-items:center;margin-top:6px}
.imp .r2 input{text-align:right}
.imp .sl{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin:0 0 2px 2px;display:block}
.imp .isub{font-weight:800;font-size:15px;white-space:nowrap;text-align:right;min-width:78px;opacity:1;margin:0;align-self:end;padding-bottom:12px}
.imp .del{width:44px;height:44px;border-radius:10px;background:#F3DADA;color:#8E1B1B;display:grid;place-items:center;align-self:end}
.imp .del svg{width:18px;height:18px}
.imp{position:relative}
.sug{position:absolute;left:6px;right:6px;top:72px;z-index:5;background:var(--white);border:1.5px solid var(--teal);border-radius:11px;box-shadow:0 8px 18px rgba(40,25,15,.18);overflow:hidden}
.sug button{display:flex;width:100%;gap:8px;align-items:baseline;text-align:left;padding:12px;min-height:46px;border-bottom:1px solid #EFE7DC;font-size:15px}
.sug button:last-child{border-bottom:0}
.sug button:active{background:#E2F0EC}
.sug b{flex:none}.sug .sd{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--brown-2)}.sug .sp{flex:none;font-weight:700;color:var(--teal-2)}
.cat{border:1.5px solid #E0D6CA;border-radius:12px;background:#FBF7F1;padding:8px;margin-bottom:8px}
.cat .ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:15px}
.cat .ch span{font-size:12px;color:var(--muted)}
.cat .cr{display:grid;grid-template-columns:1fr 104px 44px;gap:6px}
.cat input{width:100%;border:1.5px solid #E0D6CA;border-radius:9px;padding:10px;font-size:16px;background:var(--white);color:var(--brown);font-family:inherit;min-height:44px}
.cat input[data-k=precio]{text-align:right}
.cat .del{width:44px;height:44px;border-radius:10px;background:#F3DADA;color:#8E1B1B;display:grid;place-items:center}
.cat .del svg{width:18px;height:18px}
.addimp{width:100%;margin-top:8px;border:1.5px dashed #BFB2A4;border-radius:11px;min-height:46px;font-weight:700;color:var(--teal-2);background:transparent}
.imptot{margin-top:10px;border-top:1.5px solid #E0D6CA;padding-top:8px;font-size:15px}
.imptot div{display:flex;justify-content:space-between;padding:3px 2px}
.imptot .big{font-size:18px;font-weight:800;color:var(--teal-2)}
.empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:15px}
.fab{position:fixed;right:20px;bottom:calc(98px + env(safe-area-inset-bottom));width:66px;height:66px;border-radius:20px;background:var(--teal);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(14,110,100,.35);z-index:15}
.fab svg{width:30px;height:30px;stroke-width:2.2}
nav{position:fixed;left:0;right:0;bottom:0;background:#F6F1E8;border-top:1px solid #DDD3C4;display:grid;grid-template-columns:repeat(6,1fr);padding:8px 2px calc(8px + env(safe-area-inset-bottom));z-index:20}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:#5E4F48;padding:4px 0;position:relative}
nav .ic{width:50px;height:32px;border-radius:16px;display:grid;place-items:center}
nav button.on{color:var(--teal);font-weight:700}
nav button.on .ic{background:#D3E4DE}
nav .badge{position:absolute;top:0;right:calc(50% - 26px);background:var(--line);color:#fff;font-size:10px;font-weight:700;border-radius:9px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
/* sheet */
.veil{position:fixed;inset:0;background:rgba(30,20,15,.45);z-index:40;display:none}
.veil.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--white);border-radius:20px 20px 0 0;z-index:41;transform:translateY(105%);transition:transform .22s ease;padding:8px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:#D6CCC0;margin:4px auto 10px}
.sheet h2{font-family:Georgia,serif;margin:0 0 12px;font-size:21px}
.f{margin-bottom:11px}
.f label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.f input,.f textarea,.f select{width:100%;border:1.5px solid #E0D6CA;border-radius:11px;padding:11px 12px;font-size:16px;background:#FBF7F1;color:var(--brown);font-family:inherit}
.f textarea{min-height:70px;resize:vertical}
.f input:focus,.f textarea:focus,.f select:focus{outline:none;border-color:var(--teal)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1.5px solid #E0D6CA;border-radius:10px;padding:10px 4px;font-weight:600;background:#FBF7F1}
.seg button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.photos{display:flex;flex-wrap:wrap;gap:8px}
.photos .ph{position:relative;width:78px;height:78px;border-radius:10px;overflow:hidden;background:#eee}
.photos img{width:100%;height:100%;object-fit:cover}
.photos .x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:11px;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:22px;text-align:center}
.addph{width:78px;height:78px;border-radius:10px;border:1.5px dashed #BFB2A4;display:grid;place-items:center;color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.actions.sticky{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));background:var(--white);padding:10px 0 12px;margin-bottom:-8px;box-shadow:0 -6px 10px -6px rgba(0,0,0,.12)}
.actions .btn{flex:1;min-width:120px}
.danger{background:#F3DADA;color:#8E1B1B}
.primary{background:var(--teal);color:#fff}
.menu .btn{width:100%;justify-content:flex-start;margin-bottom:8px;padding:14px}
.hint{font-size:13px;color:var(--muted);line-height:1.45}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--brown);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.viewer{position:fixed;inset:0;background:#000;z-index:70;display:none;align-items:center;justify-content:center}
.viewer.on{display:flex}.viewer img{max-width:100%;max-height:100%}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div><div class="sub" id="syncState">Sin lectura del correo</div><h1 id="title">Notas</h1></div>
    <div class="hicons">
      <button id="bSearch" aria-label="Buscar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
      <button id="bData" aria-label="Copia de seguridad"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button>
      <button id="bInstall2" aria-label="Instalar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4M12 7v6M9.5 10.5L12 13l2.5-2.5"/></svg></button>
    </div>
  </div>
  <div id="searchBar"><input id="q" type="search" placeholder="Buscar dirección, nº, nombre, teléfono…" autocomplete="off"></div>
</header>

<main>
  <button class="install" id="bInstall" hidden><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4M12 7v6M9.5 10.5L12 13l2.5-2.5"/></svg>Poner en el escritorio</button>
  <div id="list"></div>
</main>

<button class="fab" id="bAdd" aria-label="Añadir parte"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

<nav id="tabs"></nav>

<div class="veil" id="veil"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div class="viewer" id="viewer"><img id="viewerImg" alt=""></div>
<input type="file" id="fileImport" accept="application/json,.json" hidden>
<input type="file" id="filePhoto" accept="image/*" capture="environment" multiple hidden>

<script>
'use strict';
const KEY='cuaderno.v1', CFG='cuaderno.cfg', CODES='cuaderno.codigos', DEAD='cuaderno.borrados';
const BK='cuaderno.backup.', RESC=KEY+'.rescate-', BK_DAYS=7, RESC_MAX=6; /* arriba del todo: load() los usa al arrancar */
const ICON={
 phone:'<svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>',
 pin:'<svg viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
 up:'<svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>', down:'<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
 notas:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>',
 iris:'<svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.7-7 9-4-1.3-7-4.5-7-9V6z"/></svg>',
 lucia:'<svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="1.5"/><path d="M9 7h6M9 11h6M9 15h6M3 21h18"/></svg>',
 part:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
 pend:'<svg viewBox="0 0 24 24"><path d="M4 6l2 2 3-3M4 14l2 2 3-3M12 7h8M12 15h8M12 19h6"/></svg>',
 clock:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 13.5v3l2 1.2"/></svg>',
 trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
 arch:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/></svg>',
};
const TABS=[['notas','Notas',ICON.notas],['iris','Iris',ICON.iris],['lucia','Lucía',ICON.lucia],['particular','Partic.',ICON.part],['pendiente','Pendiente',ICON.pend],['archivo','Archivo',ICON.arch]];
const CHECKS=[['cita','Cita'],['obra','Obra'],['fotos','Fotos'],['factura','Factura'],['cobro','Cobro']];
const COMP={iris:'Iris',lucia:'Santa Lucía',particular:'Particular'};
const MODS=['Asistencia','Bricoasistencia','Daños agua','DAE','Conexión'], PROVS=['Santa Lucía','CaixaBank','Naturgy','Anovo'];
const fold=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const modClass=m=>({asistencia:'m-asistencia',bricoasistencia:'m-brico','danos agua':'m-agua',dae:'m-dae',conexion:'m-conexion'})[fold(m)]||'';
const provClass=p=>{const f=fold(p);return f.includes('lucia')?'p-lucia':f.includes('caixa')?'p-caixa':f.includes('naturgy')?'p-naturgy':f.includes('anovo')?'p-anovo':'p-otro'};
/* canoniza a la opción de la lista si coincide (sin acentos/mayúsculas); si no, deja el texto libre */
function canon(v,opts){const t=String(v??'').trim();if(!t)return '';const f=fold(t).replace(/^danos? (por |de )?agua$/,'danos agua').replace(/^santa? ?lucia.*$/,'santa lucia').replace(/^caixa ?bank$/,'caixabank');return opts.find(o=>fold(o)===f)||t}
/* modalidad: campo explícito o, si el texto lo dice claramente (una sola coincidencia), se deduce */
function guessModalidad(r){
  const ex=r.modalidad??r.modality??r.tipo_servicio??r.tipoServicio; if(ex) return canon(ex,MODS);
  const t=fold([r.averia,r.condiciones].join(' ')), hits=[];
  if(/\bdae\b/.test(t)) hits.push('DAE');
  if(/\bdanos? (por |de )?agua\b/.test(t)) hits.push('Daños agua');
  if(/\bconexion(es)?\b/.test(t)) hits.push('Conexión');

function catFromJobs(list,seed){

  for(const j of ord) for(const l of normImportes(j.importes)){const c=normCode(l.codigo); if(!c) continue;

document.addEventListener('contextmenu',e=>{ if((press||drag)&&e.target.closest('#list')) e.preventDefault() });
/* tras soltar, el "click" que genera el navegador no abre el parte */
document.addEventListener('pointerdown',()=>{ noClick=false },true);
document.addEventListener('click',e=>{ if(noClick){ noClick=false; if(e.target.closest('#list')){ e.stopPropagation(); e.preventDefault() } } },true);
function move(j,dir){
  const l=visible(), i=l.indexOf(j), o=l[dir==='up'?i-1:i+1]; if(!o) return;
  [j.orden,o.orden]=[o.orden,j.orden]; if(j.orden===o.orden) j.orden+=dir==='up'?1:-1; save(); render();
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render();scrollTo(0,0)}});
$('#bSearch').onclick=()=>{const s=$('#searchBar');s.classList.toggle('on');if(s.classList.contains('on'))$('#q').focus();else{$('#q').value='';query='';render()}};
$('#q').oninput=e=>{query=e.target.value.trim();render()};

/* sheet */
function openSheet(html){$('#sheet').innerHTML='<div class="grab"></div>'+html;$('#veil').classList.add('on');$('#sheet').classList.add('on');$('#sheet').scrollTop=0}
function closeSheet(){$('#veil').classList.remove('on');$('#sheet').classList.remove('on');editing=null}
$('#veil').onclick=closeSheet;

function openVisita(j){
  const p=n=>String(n).padStart(2,'0'), local=d=>`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  const base=j.visita&&!isNaN(new Date(j.visita))?new Date(j.visita):null;
  const hoy=new Date(), man=new Date(Date.now()+864e5);
  openSheet(`<h2>Hora de visita</h2>
  <p class="hint" style="margin-top:-6px">${esc(fullAddr(j)||'(sin dirección)')}${j.asegurado?' · '+esc(j.asegurado):''}</p>
  <div class="row2"><div class="f"><label>Día</label><input id="v_dia" type="date" value="${base?local(base):''}"></div>
  <div class="f"><label>Hora</label><input id="v_hora" type="time" step="300" value="${base?p(base.getHours())+':'+p(base.getMinutes()):''}"></div></div>
  <div class="quick" id="vQuick"><button type="button" data-d="${local(hoy)}">Hoy</button><button type="button" data-d="${local(man)}">Mañana</button>
  ${['09:00','10:00','12:00','16:00','18:00'].map(h=>`<button type="button" data-h="${h}">${h}</button>`).join('')}</div>
  <div class="actions">
    ${base?'<button class="btn danger" id="vDel">Quitar</button>':'<button class="btn soft" id="vCancel">Cancelar</button>'}
    <button class="btn primary" id="vOk">Guardar</button>
  </div>`);
  $('#vQuick').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.d)$('#v_dia').value=b.dataset.d;if(b.dataset.h){$('#v_hora').value=b.dataset.h;if(!$('#v_dia').value)$('#v_dia').value=local(hoy)}};
  if($('#vCancel')) $('#vCancel').onclick=closeSheet;
  if($('#vDel')) $('#vDel').onclick=()=>setVisita(j,'');
  $('#vOk').onclick=()=>{
    const d=$('#v_dia').value, h=$('#v_hora').value;
    if(!d){toast('Elige el día de la visita');return}
    const dt=new Date(d+'T'+(h||'09:00')); if(isNaN(dt)){toast('Fecha no válida');return}
    setVisita(j,dt.toISOString());
  };
}
function setVisita(j,iso){
  j.visita=iso; if(iso) j.checks={...(j.checks||{}),cita:true};
  j.mod=Date.now(); if(save()){closeSheet();render();toast(iso?'Visita: '+fmtVisita(iso).txt:'Hora de visita quitada')}
}
function openEdit(j){
  const isNew=!j;
  editing=j?JSON.parse(JSON.stringify(j)):{id:'p-'+Date.now().toString(36),numero:'',compania:tab==='iris'||tab==='lucia'?tab:'particular',direccion:'',poblacion:'',telefono:'',asegurado:'',averia:'',condiciones:'',notas:'',fotos:[],fecha:new Date().toISOString(),checks:{},visita:'',importes:[],modalidad:'',proveedor:tab==='iris'||tab==='lucia'?'Santa Lucía':'',archivado:false};
  editing._new=isNew;
  const e=editing; e.importes=normImportes(e.importes);
  const sel=(id,opts,v,otra)=>{const c=canon(v,opts), other=c&&!opts.includes(c);
    return `<select id="${id}"><option value="">—</option>${opts.map(o=>`<option${o===c?' selected':''}>${o}</option>`).join('')}<option value="__otra"${other?' selected':''}>${otra}…</option></select>
    <input id="${id}_txt" placeholder="Escribe ${otra.toLowerCase()==='otra'?'la modalidad':'el proveedor'}" value="${other?esc(c):''}" style="margin-top:6px${other?'':';display:none'}">`};
  openSheet(`<h2>${isNew?'Nuevo parte':'Parte '+esc(e.numero)}</h2>
  <div id="eChips">${chips(e)}</div>
  <div class="f"><label>Compañía</label><div class="seg" id="segComp">${Object.entries(COMP).map(([k,n])=>`<button type="button" data-c="${k}" class="${e.compania===k?'on':''}">${n}</button>`).join('')}</div></div>
  <div class="row2"><div class="f"><label>Modalidad</label>${sel('e_modalidad',MODS,e.modalidad,'Otra')}</div>
  <div class="f"><label>Proveedor</label>${sel('e_proveedor',PROVS,e.proveedor,'Otro')}</div></div>
  <div class="row2"><div class="f"><label>Nº siniestro</label><input id="e_numero" inputmode="numeric" value="${esc(e.numero)}"></div>
  <div class="f"><label>Teléfono</label><input id="e_telefono" type="tel" inputmode="tel" value="${esc(e.telefono)}"></div></div>
  <div class="f"><label>Asegurado / cliente</label><input id="e_asegurado" value="${esc(e.asegurado)}"></div>
  <div class="f"><label>Dirección</label><input id="e_direccion" value="${esc(e.direccion)}" placeholder="Calle, número, piso"></div>
  <div class="f"><label>Población</label><input id="e_poblacion" value="${esc(e.poblacion)}"></div>
  <div class="f"><label>Hora de visita</label><input id="e_visita" type="datetime-local" value="${e.visita?toLocalInput(e.visita):''}"></div>
  <div class="f"><label>Avería</label><textarea id="e_averia">${esc(e.averia)}</textarea></div>
  <div class="f"><label>Condiciones</label><textarea id="e_condiciones">${esc(e.condiciones)}</textarea></div>
  <div class="f"><label>Notas</label><textarea id="e_notas" placeholder="Material, horas, lo que hiciste…">${esc(e.notas)}</textarea></div>
  <div class="f"><label>Importes</label><div class="imps" id="imps"></div>
    <button type="button" class="addimp" id="addImp">+ Añadir línea</button>
    <div class="imptot" id="impTot"></div></div>
  <div class="f"><label>Fotos</label><div class="photos" id="photos"></div></div>
  <div class="f"><label>Fecha de entrada</label><input id="e_fecha" type="datetime-local" value="${toLocalInput(e.fecha)}"></div>
  <div class="actions sticky">
    <button class="btn soft" id="eCancel">Cancelar</button>
    <button class="btn primary" id="eSave">Guardar</button>
  </div>
  ${isNew?'':`<div class="actions">
    <button class="btn soft" id="eArch">${e.archivado?'Sacar del archivo':'Archivar'}</button>
    <button class="btn danger" id="eDel">Borrar</button></div>`}`);
  renderPhotos(); renderImportes();
  for(const k of ['modalidad','proveedor']){
    const s=$('#e_'+k), t=$('#e_'+k+'_txt');
    const upd=()=>{e[k]=readSel(k);$('#eChips').innerHTML=chips(e)};
    s.onchange=()=>{t.style.display=s.value==='__otra'?'':'none'; if(s.value==='__otra') t.focus(); upd()};
    t.oninput=upd;
  }
  $('#segComp').onclick=ev=>{const b=ev.target.closest('[data-c]');if(!b)return;e.compania=b.dataset.c;[...$('#segComp').children].forEach(x=>x.classList.toggle('on',x===b))};
  $('#eCancel').onclick=closeSheet;
  $('#eSave').onclick=()=>commit();
  if(!isNew){
    $('#eArch').onclick=()=>{e.archivado=!e.archivado;commit(e.archivado?'Archivado':'Recuperado')};
    $('#eDel').onclick=()=>{if(confirm('¿Borrar este parte? No volverá a aparecer al leer el correo (se puede recuperar en Copia de seguridad → Borrados).')){const o=jobs.find(x=>x.id===e.id)||e;bury(o);jobs=jobs.filter(x=>x.id!==e.id);save();closeSheet();render();toast('Borrado')}};
  }
}
function toLocalInput(iso){const d=new Date(iso);if(isNaN(d))return '';const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function readSel(k){const s=$('#e_'+k);return s.value==='__otra'?$('#e_'+k+'_txt').value.trim():s.value}
function commit(msg){
  const e=editing;
  ['numero','telefono','asegurado','direccion','poblacion','averia','condiciones','notas'].forEach(k=>e[k]=$('#e_'+k).value.trim()); e.poblacion=cleanPob(e.poblacion);
  e.telefono=digits(e.telefono)||e.telefono;
  e.modalidad=readSel('modalidad'); e.proveedor=readSel('proveedor');
  const f=$('#e_fecha').value; if(f) e.fecha=new Date(f).toISOString();
  const v=$('#e_visita').value; e.visita=v&&!isNaN(new Date(v))?new Date(v).toISOString():''; if(e.visita) e.checks={...(e.checks||{}),cita:true};
  e.importes=normImportes(e.importes).filter(l=>l.codigo.trim()||l.desc.trim()||l.precio).map(l=>({...l,codigo:normCode(l.codigo),desc:l.desc.trim()}));
  learn(e.importes,(jobs.find(x=>x.id===e.id)||{}).importes);
  e.mod=Date.now();
  const isNew=e._new; delete e._new;
  if(isDead(e)) unbury(e);
  if(isNew){e.orden=Math.max(0,...jobs.map(j=>j.orden||0))+1;jobs.push(e)} else {const i=jobs.findIndex(x=>x.id===e.id);jobs[i]=e}
  if(save()){closeSheet();render();toast(msg||'Guardado')}
}
function renderImportes(){
  const e=editing, L=e.importes;
  $('#imps').innerHTML=L.length?L.map((l,i)=>`<div class="imp" data-i="${i}">
    <div class="r1"><div><span class="sl">Código</span><input data-k="codigo" value="${esc(l.codigo)}" placeholder="Código" autocapitalize="characters" autocomplete="off"></div>
    <div><span class="sl">Descripción</span><input data-k="desc" value="${esc(l.desc)}" placeholder="Opcional" autocomplete="off"></div></div>
    <div class="r2"><div><span class="sl">Cant.</span><input data-k="cant" inputmode="decimal" value="${esc(numTxt(l.cant))}"></div>
    <div><span class="sl">Precio €</span><input data-k="precio" inputmode="decimal" value="${l.precio?r2(parseNum(l.precio)).toFixed(2).replace('.',','):''}" placeholder="0,00"></div>
    <span class="isub">${eur(lineaSub(l))}</span>
    <button type="button" class="del" data-del="${i}" aria-label="Borrar línea">${ICON.trash}</button></div></div>`).join(''):'<p class="hint" style="margin:2px 0 0">Sin importes. Añade los códigos y precios de facturación.</p>';
  renderImpTot();
  const upd=(box,l)=>{box.querySelector(".isub").textContent=eur(lineaSub(l)); renderImpTot()};
  const setIn=(box,k,v)=>box.querySelector(`[data-k=${k}]`).value=v;
  const fill=(box,l,c,all)=>{const v=cat[c]; if(!v) return;
    if(all||!String(l.desc).trim()){l.desc=v.desc||'';setIn(box,'desc',l.desc)}
    if(all||!parseNum(l.precio)){l.precio=v.precio||0;setIn(box,'precio',l.precio?r2(l.precio).toFixed(2).replace('.',','):'')}
    if(all){l.codigo=c;setIn(box,'codigo',c)} upd(box,l)};
  const hideSug=()=>document.querySelectorAll('#imps .sug').forEach(x=>x.remove());
  const showSug=(box,q)=>{hideSug(); const r=buscarCodigos(q); if(!r.length||(r.length===1&&r[0].c===normCode(q))) return;
    const d=document.createElement('div'); d.className='sug';
    d.innerHTML=r.map(x=>`<button type="button" data-code="${esc(x.c)}"><b>${esc(x.c)}</b><span class="sd">${esc(x.desc||'')}</span><span class="sp">${x.precio?eur(x.precio):''}</span></button>`).join('');
    d.onpointerdown=ev=>ev.preventDefault();
    d.onclick=ev=>{const b=ev.target.closest('[data-code]'); if(!b) return; fill(box,L[+box.dataset.i],b.dataset.code,true); hideSug(); box.querySelector('[data-k=cant]').focus()};
    box.appendChild(d)};
  $('#imps').oninput=ev=>{
    const k=ev.target.dataset.k, box=ev.target.closest('.imp'); if(!k||!box) return; const l=L[+box.dataset.i];
    l[k]=(k==='cant'||k==='precio')?(ev.target.value.trim()===''&&k==='cant'?'':parseNum(ev.target.value)):ev.target.value;
    if(k==='codigo'){const c=normCode(l.codigo); if(cat[c]) fill(box,l,c,false)}
    if(k==='codigo'||k==='desc'){const q=ev.target.value.trim(); if(q) showSug(box,q); else hideSug()}
    upd(box,l);
  };
  $('#imps').onfocusin=ev=>{const box=ev.target.closest('.imp'); if(ev.target.dataset.k==='codigo'&&box&&!ev.target.value.trim()&&Object.keys(cat).length) showSug(box,'')};
  $('#imps').onfocusout=ev=>{const box=ev.target.closest('.imp'); if(ev.target.dataset.k==='codigo'&&box){const l=L[+box.dataset.i]; l.codigo=normCode(l.codigo); ev.target.value=l.codigo; if(cat[l.codigo]) fill(box,l,l.codigo,false)} setTimeout(()=>{if(!document.activeElement?.closest?.('.imp [data-k=codigo],.imp [data-k=desc]')) hideSug()},150)};
  $('#imps').onclick=ev=>{const b=ev.target.closest('[data-del]'); if(!b) return; L.splice(+b.dataset.del,1); renderImportes();};
  $('#addImp').onclick=()=>{L.push({codigo:'',desc:'',cant:1,precio:0}); renderImportes(); const ins=$('#imps').querySelectorAll('.imp:last-child input'); if(ins[0]) ins[0].focus();};
}
function renderImpTot(){
  const t=totales(editing.importes);
  $('#impTot').innerHTML=editing.importes.length?`<div><span>Total sin IVA</span><b>${eur(t.base)}</b></div><div><span>IVA 21%</span><span>${eur(t.iva)}</span></div><div class="big"><span>Total con IVA</span><span>${eur(t.total)}</span></div>`:'';
}
function renderPhotos(){
  const e=editing;
  $('#photos').innerHTML=(e.fotos||[]).map((p,i)=>`<div class="ph"><img src="${p}" data-i="${i}"><button class="x" data-del="${i}">×</button></div>`).join('')+`<button class="addph" id="addPh" type="button"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>`;
  $('#addPh').onclick=()=>$('#filePhoto').click();
  $('#photos').onclick=ev=>{
    const d=ev.target.dataset.del; if(d!==undefined){e.fotos.splice(+d,1);renderPhotos();return}
    const i=ev.target.dataset.i; if(i!==undefined){$('#viewerImg').src=e.fotos[+i];$('#viewer').classList.add('on')}
  };
}
$('#viewer').onclick=()=>$('#viewer').classList.remove('on');
$('#filePhoto').onchange=async ev=>{
  for(const file of ev.target.files){ try{ editing.fotos=[...(editing.fotos||[]),await shrink(file)] }catch(e){toast('No se pudo leer la foto')} }
  ev.target.value=''; renderPhotos();
};
function shrink(file,max=1000,q=.62){return new Promise((ok,ko)=>{const img=new Image();img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*r;c.height=img.height*r;c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);ok(c.toDataURL('image/jpeg',q))};img.onerror=ko;img.src=URL.createObjectURL(file)})}
$('#bAdd').onclick=()=>openEdit(null);

function openCopias(){
  const fd=t=>new Date(t).toLocaleString('es-ES',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  const items=[...diarias().reverse().map(k=>{const raw=localStorage.getItem(k);let t=0;try{t=JSON.parse(raw).t||0}catch(e){}
      const [y,mo,d]=k.slice(BK.length).split('-').map(Number);
      return {k,tit:new Date(y,mo-1,d).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}).replace(/^./,c=>c.toUpperCase()),sub:(t?'guardada '+new Date(t).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})+' · ':'')+'copia diaria',n:cuenta(raw),kb:Math.round((raw||'').length/1024)}}),
    ...lsKeys(RESC).reverse().map(k=>{const raw=localStorage.getItem(k);return {k,tit:'Rescate · '+fd(+k.slice(RESC.length)),sub:'copia automática antes de un cambio grande',n:cuenta(raw),kb:Math.round((raw||'').length/1024)}})];
  openSheet(`<h2>Copias de seguridad</h2>
  <p class="hint" style="margin-top:-6px">El móvil guarda solo una copia por día (los últimos 7 días) y otra antes de cualquier cambio grande. Las fotos no van en estas copias, pero al restaurar se conservan las que tengas ahora. Ahora tienes ${jobs.length} partes.</p>
  <div id="bkList">${items.length?items.map(x=>`<div class="cat" data-k="${esc(x.k)}"><div class="ch"><b>${esc(x.tit)}</b><span>${x.n<0?'ilegible':x.n+(x.n===1?' parte':' partes')}</span></div>
    <div style="display:flex;gap:8px;align-items:center"><span style="flex:1;font-size:14px;color:var(--brown-2)">${esc(x.sub)} · ${x.kb} KB</span>${x.n>=0?'<button type="button" class="btn primary" data-res="1" style="min-width:120px">Restaurar</button>':''}</div></div>`).join(''):'<p class="hint">Todavía no hay copias. Se crea una al abrir la app cada día.</p>'}</div>
  <div class="actions sticky"><button class="btn soft" id="bkOk">Cerrar</button></div>`);
  $('#bkOk').onclick=closeSheet;
  $('#bkList').onclick=ev=>{const b=ev.target.closest('[data-res]'); if(!b) return; restaurar(b.closest('.cat').dataset.k)};
}
function restaurar(k){
  let d=null; try{d=JSON.parse(localStorage.getItem(k))}catch(e){}
  const list=listaDe(d); if(!list){toast('Esa copia no se puede leer');return false}
  if(!confirm(`¿Restaurar esta copia (${list.length} partes)?\n\nLos ${jobs.length} partes que tienes ahora se guardan antes como copia de rescate, por si acaso.`)) return false;
  let snap=false; try{snap=guardaRescate(JSON.stringify({t:Date.now(),motivo:'antes de restaurar',partes:jobs,codigos:cat,borrados:dead}))}catch(e){}
  if(!snap&&!confirm('No hay espacio para guardar antes lo actual. ¿Restaurar igualmente?')) return false;
  const fotosDe=new Map(); for(const j of jobs) if(j.fotos&&j.fotos.length){fotosDe.set('id:'+j.id,j.fotos); if(normNum(j.numero)) fotosDe.set(normNum(j.numero),j.fotos)}
  jobs=migrate(JSON.parse(JSON.stringify(list))).map(j=>({...j,fotos:Array.isArray(j.fotos)&&j.fotos.length?j.fotos:(fotosDe.get('id:'+j.id)||fotosDe.get(normNum(j.numero))||[])}));
  if(!Array.isArray(d)){
    if(d.codigos&&typeof d.codigos==='object'&&!Array.isArray(d.codigos)){cat=d.codigos;saveCat()}
    if(d.borrados&&typeof d.borrados==='object'&&!Array.isArray(d.borrados)){dead=d.borrados;saveDead()}
  }
  save({force:true}); closeSheet(); render(); toast('Copia restaurada: '+jobs.length+' partes'); return true;
}
function openBorrados(){
  const l=Object.entries(dead).sort((a,b)=>(b[1].t||0)-(a[1].t||0));
  openSheet(`<h2>Borrados</h2>
  <p class="hint" style="margin-top:-6px">Estos partes no vuelven a entrar al leer el correo. Pulsa “Recuperar” si borraste uno por error.</p>
  <div id="dList">${l.length?l.map(([k,x])=>`<div class="cat" data-k="${esc(k)}"><div class="ch"><b>${esc(x.numero||'(sin nº)')}</b><span>borrado ${esc(new Date(x.t).toLocaleDateString('es-ES',{day:'numeric',month:'short'}))}</span></div>
    <div style="display:flex;gap:8px;align-items:center"><span style="flex:1;font-size:14px;color:var(--brown-2)">${esc(x.dir||(x.parte&&fullAddr(x.parte))||'')}</span><button type="button" class="btn primary" data-rec="1" style="min-width:120px">Recuperar</button></div></div>`).join(''):'<p class="hint">No hay partes borrados.</p>'}</div>
  <div class="actions sticky"><button class="btn soft" id="dOk">Cerrar</button></div>`);
  $('#dOk').onclick=closeSheet;
  $('#dList').onclick=ev=>{const b=ev.target.closest('[data-rec]'); if(!b) return; const k=b.closest('.cat').dataset.k, x=dead[k]; if(!x) return;
    delete dead[k]; saveDead();
    if(x.parte&&!jobs.some(j=>j.id===x.parte.id||(normNum(x.parte.numero)&&normNum(j.numero)===normNum(x.parte.numero)))){
      const j={...x.parte,fotos:[],mod:Date.now(),orden:Math.max(0,...jobs.map(j=>j.orden||0))+1}; jobs.push(j); save(); render(); openBorrados(); toast('Recuperado '+(j.numero||''));
    } else { render(); openBorrados(); toast('Recuperado: volverá con la próxima lectura del correo'); sync(); }
  };
}
function openCodigos(){
  openSheet(`<h2>Códigos y precios</h2>
  <p class="hint" style="margin-top:-6px">Se aprenden solos al guardar los importes de cada parte. Precios sin IVA.</p>
  <div class="f"><input id="cQ" type="search" placeholder="Buscar código o descripción…" autocomplete="off"></div>
  <div id="cList"></div>
  <div class="actions sticky"><button class="btn primary" id="cOk">Hecho</button></div>`);
  const draw=()=>{const r=buscarCodigos($('#cQ').value.trim(),1e4);
    $('#cList').innerHTML=r.length?r.map(x=>`<div class="cat" data-c="${esc(x.c)}"><div class="ch"><b>${esc(x.c)}</b><span>${x.usos||0} ${x.usos===1?'uso':'usos'}</span></div>
    <div class="cr"><input data-k="desc" value="${esc(x.desc||'')}" placeholder="Descripción"><input data-k="precio" inputmode="decimal" value="${x.precio?r2(x.precio).toFixed(2).replace('.',','):''}" placeholder="0,00 €">
    <button type="button" class="del" data-del="1" aria-label="Borrar código">${ICON.trash}</button></div></div>`).join(''):'<p class="hint">Aún no hay códigos. Añade importes en un parte y guárdalo.</p>'};
  draw();
  $('#cQ').oninput=draw;
  $('#cList').onchange=ev=>{const box=ev.target.closest('.cat'), k=ev.target.dataset.k; if(!box||!k) return; const v=cat[box.dataset.c]; if(!v) return;
    if(k==='precio'){v.precio=r2(parseNum(ev.target.value)); ev.target.value=v.precio?v.precio.toFixed(2).replace('.',','):''} else v.desc=ev.target.value.trim();
    v.mod=Date.now(); saveCat(); toast('Código '+box.dataset.c+' guardado')};
  $('#cList').onclick=ev=>{const b=ev.target.closest('[data-del]'); if(!b) return; const c=b.closest('.cat').dataset.c;
    if(confirm('¿Borrar el código '+c+' del catálogo? (los partes no cambian)')){delete cat[c]; saveCat(); draw(); toast('Código borrado')}};
  $('#cOk').onclick=closeSheet;
}
function exportJSON(){
  const blob=new Blob([JSON.stringify({app:'cuaderno',version:1,exportado:new Date().toISOString(),partes:jobs,codigos:cat,borrados:dead},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cuaderno-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();toast('Copia descargada');
}
$('#fileImport').onchange=async ev=>{
  const f=ev.target.files[0]; ev.target.value=''; if(!f) return;
  try{const d=JSON.parse(await f.text()); const list=Array.isArray(d)?d:d.partes; if(!Array.isArray(list)) throw 0;
    if(!Array.isArray(d)) mergeDead(d.borrados);
    const n=merge(list,true); save(); if(!Array.isArray(d)) mergeCat(d.codigos); catFromJobs(list.filter(r=>!isDead(r))); saveCat(); closeSheet(); render(); toast(`Importados: ${n.added} nuevos, ${n.updated} actualizados`);
  }catch(e){toast('Ese archivo no es una copia válida')}
};
/* merge by numero (or id). overwrite=true replaces existing (import), false only adds new (sync) */
function merge(list,overwrite){
  let added=0,updated=0,skipped=0; let top=Math.max(0,...jobs.map(j=>j.orden||0));
  list=[...list].filter(r=>r&&typeof r==='object').sort((a,b)=>String(a.fecha||'').localeCompare(String(b.fecha||'')));
  for(const r of list){
    if(isDead(r)){skipped++;continue}
    const j=normalize(r);
    const ex=jobs.find(x=>(j.numero&&x.numero===j.numero)||x.id===j.id);
    if(ex){ if(overwrite&&(j.mod||0)>=(ex.mod||0)){ if(!Array.isArray(r.importes)) j.importes=ex.importes||[]; if(!j.visita&&!('visita' in r)) j.visita=ex.visita||''; for(const k of ['modalidad','proveedor']) if(!(k in r)&&ex[k]!=null) j[k]=ex[k]; Object.assign(ex,j,{orden:ex.orden});updated++} else if(!overwrite){ for(const k of ['asegurado','telefono','direccion','poblacion','averia','condiciones','visita']) if(!ex[k]&&j[k]) ex[k]=j[k]; if(!(ex.importes||[]).length&&j.importes.length) ex.importes=j.importes; if(!ex.modalidad&&j.modalidad) ex.modalidad=j.modalidad; const rp=r.proveedor??r.provider; if(!ex.proveedor&&rp) ex.proveedor=canon(rp,PROVS); } }
    else { j.orden=++top; jobs.push(j); added++; }
  }
  return {added,updated,skipped};
}
function normalize(r){
  let c=String(r.compania||r.company||'').toLowerCase();
  c=c.includes('iris')?'iris':c.includes('luc')?'lucia':c?'particular':'particular';
  return {id:r.id||('x-'+(r.numero||Date.now().toString(36))),numero:String(r.numero||r.siniestro||''),compania:c,direccion:r.direccion||'',poblacion:cleanPob(r.poblacion),
    telefono:digits(r.telefono)||String(r.telefono||''),asegurado:r.asegurado||'',averia:r.averia||'',condiciones:r.condiciones||'',notas:r.notas||'',fotos:Array.isArray(r.fotos)?r.fotos:[],
    fecha:r.fecha||new Date().toISOString(),checks:r.checks||{},visita:normVisita(r.visita||r.horaVisita||r.hora_visita),importes:normImportes(r.importes),modalidad:guessModalidad(r),proveedor:(r.proveedor??r.provider)!=null?canon(r.proveedor??r.provider,PROVS):(c==='iris'||c==='lucia'?'Santa Lucía':''),archivado:!!r.archivado,mod:r.mod||0};
}
function normVisita(v){ if(!v) return ''; const d=new Date(v); return isNaN(d)?'':d.toISOString(); }
async function sync(manual){
  if(!cfg.url){ if(manual) toast('Pon primero la dirección de sincronización'); return; }
  try{
    $('#syncState').textContent='Leyendo correo…';
    const res=await fetch(cfg.url,{cache:'no-store'}); if(!res.ok) throw new Error(res.status);
    const d=await res.json(); const list=Array.isArray(d)?d:(d.partes||d.records||d.record||[]);
    const n=merge(Array.isArray(list)?list:Object.values(list),false); save();
    cfg.last=Date.now(); localStorage.setItem(CFG,JSON.stringify(cfg)); render();
    if(n.added) toast(n.added===1?'1 siniestro nuevo':n.added+' siniestros nuevos'); else if(manual) toast('No hay siniestros nuevos');
  }catch(e){ $('#syncState').textContent='Sin conexión con el correo'; if(manual) toast('No se pudo leer: '+e.message); }
}
function renderSync(){ $('#syncState').textContent=!cfg.url?'Sin lectura del correo':cfg.last?'Correo leído hace '+ago(new Date(cfg.last).toISOString()).replace('ahora','un momento'):'Correo pendiente de leer'; }

/* install */
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(!standalone) $('#bInstall').hidden=false;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(!standalone)$('#bInstall').hidden=false});
addEventListener('appinstalled',()=>{$('#bInstall').hidden=true;toast('Instalada en el escritorio')});
async function install(){
  if(deferredPrompt){deferredPrompt.prompt();const r=await deferredPrompt.userChoice;deferredPrompt=null;if(r.outcome==='accepted')$('#bInstall').hidden=true;return}
  openSheet(`<h2>Poner en el escritorio</h2><p class="hint" style="font-size:15px">En Chrome (Android): pulsa los <b>tres puntos ⋮</b> arriba a la derecha y elige <b>“Añadir a pantalla de inicio”</b> o <b>“Instalar aplicación”</b>.<br><br>En iPhone (Safari): pulsa <b>Compartir</b> y luego <b>“Añadir a pantalla de inicio”</b>.</p><div class="actions"><button class="btn primary" onclick="closeSheet()">Entendido</button></div>`);
}
$('#bInstall').onclick=install; $('#bInstall2').onclick=install;

if('serviceWorker' in navigator && location.protocol!=='file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
/* importar por enlace: #importar=<JSON en base64url, UTF-8>. El fragmento (#) nunca llega al servidor */
function b64urlToText(b){
  b=b.replace(/-/g,'+').replace(/_/g,'/').replace(/\s/g,''); while(b.length%4) b+='=';
  const bin=atob(b), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(u);
}
function importFromHash(){
  const m=location.hash.match(/^#importar=(.+)$/); if(!m) return false;
  history.replaceState(null,'',location.pathname+location.search);
  try{
    let raw=decodeURIComponent(m[1]); const d=JSON.parse(b64urlToText(raw));
    const list=Array.isArray(d)?d:d.partes; if(!Array.isArray(list)) throw 0;
    if(!Array.isArray(d)) mergeDead(d.borrados);
    const n=merge(list,false); save(); if(!Array.isArray(d)) mergeCat(d.codigos); catFromJobs(list.filter(r=>!isDead(r))); saveCat(); render();
    toast(n.added?(n.added===1?'1 siniestro importado':n.added+' siniestros importados'):n.skipped&&!n.updated?'Esos siniestros los habías borrado (recupéralos en Copia de seguridad → Borrados)':'Esos siniestros ya estaban en la app');
  }catch(e){toast('El enlace de importación no es válido')}
  return true;
}
addEventListener('hashchange',importFromHash);
if(!cat){cat={};catFromJobs(jobs,true);saveCat()}
copiaDiaria();
render();
importFromHash();
firstRun().then(()=>sync());
setInterval(()=>{render()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){copiaDiaria();sync();render()}});
</script>
